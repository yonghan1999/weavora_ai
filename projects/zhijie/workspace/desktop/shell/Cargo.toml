[package]
name = "zhijie-shell"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tauri = { version = "2.8.5", features = [] }
serde_json = "1.0.145"
zhijie-core = { path = "../../client/core" }
zhijie-voice = { path = "../../client/voice" }
tokio = { version = "1.48.0", features = ["sync", "time"] }
time = { version = "0.3.44", features = ["parsing"] }
zhijie-helper = { path = "../../network/helper" }
base64 = "0.22.1"
boringtun = "0.7.1"
rand = "0.8.5"

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dev-dependencies]
tauri = { version = "2.8.5", features = ["test"] }
