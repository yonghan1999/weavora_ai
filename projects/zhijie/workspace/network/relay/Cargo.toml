[package]
name = "zhijie-relay"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
reqwest = { version = "0.12.24", default-features = false, features = ["json", "blocking", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

[lib]
path = "src/lib.rs"

[[bin]]
name = "zhijie-relay"
path = "src/main.rs"
