[package]
name = "zhijie-helper"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
base64 = "0.22.1"
boringtun = "0.7.1"
interprocess = "2.4.7"
ipnet = "2.12.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
time = { version = "0.3.44", features = ["parsing", "formatting"] }
tun = "0.8.14"

[lib]
path = "src/lib.rs"

[[bin]]
name = "zhijie-helper"
path = "src/main.rs"
