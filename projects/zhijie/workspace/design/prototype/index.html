function renderModal(){const m=state.modal;document.getElementById('modal').innerHTML=m?`<div class="modal-backdrop" role="presentation"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><h2 id="modal-title">${m.title}</h2><div>${m.body}</div><div class="modal-actions"><button class="btn" data-action="modal-close">取消</button>${m.action?`<button class="btn ${m.danger?'danger':'primary'}" data-action="${m.action}">${m.label}</button>`:''}</div></section></div>`:''}
function authView(){const mode=state.authMode;let body='';
 if(mode==='login')body=`<div class="field"><label for="email">邮箱</label><input id="email" type="email" value="demo@example.test" autocomplete="username"></div><div class="field"><label for="password">密码</label><input id="password" type="password" value="prototype-only" autocomplete="current-password"></div><button class="btn primary" style="width:100%" data-action="login">使用模拟账号登录</button><div class="auth-links"><button class="text-btn" data-action="auth-mode" data-mode="register">注册账号</button><button class="text-btn" data-action="auth-mode" data-mode="forgot">找回密码</button></div>`;
 if(mode==='register')body=`<div class="notice">注册后必须完成邮箱验证。未验证账号不能访问好友、群组或房间。</div><div class="field"><label for="reg-email">邮箱</label><input id="reg-email" type="email" placeholder="name@example.com"></div><div class="field"><label for="reg-pass">设置密码</label><input id="reg-pass" type="password"></div><button class="btn primary" style="width:100%" data-action="register">发送模拟验证码</button><div class="auth-links"><button class="text-btn" data-action="auth-mode" data-mode="login">返回登录</button></div>`;
 if(mode==='verify')body=`<div class="notice ok">模拟邮件已发送。真实邮件投递不在本原型验证范围内。</div><div class="field"><label for="code">6 位验证码</label><input id="code" inputmode="numeric" maxlength="6" placeholder="000000"></div><button class="btn primary" style="width:100%" data-action="verify">验证并激活</button><div class="auth-links"><button class="text-btn" data-action="auth-mode" data-mode="register">更换邮箱</button></div>`;
 if(mode==='forgot')body=`<div class="notice">仅向已验证邮箱发送重置邮件，不提供人工绕过验证的找回入口。</div><div class="field"><label for="forgot-email">已验证邮箱</label><input id="forgot-email" type="email" placeholder="name@example.com"></div><button class="btn primary" style="width:100%" data-action="forgot">发送模拟重置邮件</button><div class="auth-links"><button class="text-btn" data-action="auth-mode" data-mode="login">返回登录</button></div>`;
 if(mode==='reset')body=`<div class="field"><label for="new-pass">新密码</label><input id="new-pass" type="password"></div><div class="notice">重置后旧密码及旧会话按实现规则失效；本原型仅演示页面路径。</div><button class="btn primary" style="width:100%" data-action="reset">完成模拟重置</button>`;
 return `<div class="auth-wrap"><main class="auth-card"><h1>织界</h1><p class="sub">朋友、群组、语音与虚拟局域网联机</p>${body}<div class="footer-note">低保真原型 · 输入内容不会发送或保存</div></main></div>`}
function nav(){return `<aside class="sidebar"><div class="brand">织<small>ZHIJIE</small></div><nav class="nav" aria-label="群组导航"><button aria-label="好友" class="${state.view==='friends'?'active':''}" data-action="nav" data-view="friends">好友</button><button aria-label="周末远征队" class="${['group','room'].includes(state.view)?'active':''}" data-action="group-open">远征</button><button aria-label="像素工坊" data-action="accept-group-invite">像素</button><button aria-label="创建群组" data-action="create-group">＋</button></nav><div style="flex:1"></div></aside>`}
function userPanel(){return `${state.joined?`<div class="voice-panel"><strong>● ${statusText(state.voice)}</strong><div class="small">${esc(state.currentRoom)} / 周末远征队</div><div class="small">网络：${statusText(state.network)}</div><div class="actions"><button class="icon-btn" data-action="room-open" data-room="${state.currentRoom}" title="活动详情">活动详情</button><button class="icon-btn" data-action="leave-room" title="退出活动">断开</button></div></div>`:''}<div class="user-panel"><span class="avatar">林</span><div class="small"><strong>林墨</strong><br><span class="muted">${state.muted?'已静音':'在线'}</span></div><div class="actions"><button class="icon-btn" data-action="toggle-mute" title="麦克风静音">${state.muted?'启麦':'静音'}</button><button class="icon-btn" data-action="toggle-deafen" title="关闭接收">${state.deafened?'收听':'闭麦'}</button><button class="icon-btn" data-action="nav" data-view="account" title="账号设置">设置</button></div></div><div class="small muted" style="padding:6px 10px">服务：已连接（模拟）· 异常时在此提示并可重试</div>`}
function context(){if(['group','room'].includes(state.view))return `<aside class="context"><h2>周末远征队　⌄</h2><div class="context-list"><div class="channel-label">文字频道</div><button class="list-item ${state.view==='group'&&state.groupTab==='messages'?'active':''}" data-action="group-tab" data-tab="messages"><div class="channel-row"><span class="channel-icon">#</span><strong>大厅闲聊</strong></div></button><button class="list-item" data-action="group-tab" data-tab="invites"><div class="channel-row"><span class="channel-icon">#</span><strong>邀请与组队</strong></div></button><div class="channel-label">游戏房间　<button class="icon-btn" data-action="create-room">＋</button></div>${state.rooms.map(r=>`<button class="list-item ${state.view==='room'&&state.currentRoom===r.name?'active':''}" data-action="room-open" data-room="${r.name}"><div class="channel-row"><span>🔊</span><strong>${r.name}</strong><small>${r.count}/16</small></div></button>${r.state==='活动中'?'<div class="voice-users">阿岚　北屿　青禾</div>':''}`).join('')}<div class="channel-label manage">群管理 · 独立管理区</div><button class="list-item ${state.groupTab==='rooms'?'active':''}" data-action="group-tab" data-tab="rooms">房间管理</button><button class="list-item ${state.groupTab==='members'?'active':''}" data-action="group-tab" data-tab="members">成员与角色</button><button class="list-item ${state.groupTab==='audit'?'active':''}" data-action="group-tab" data-tab="audit">管理记录</button><button class="list-item ${state.groupTab==='settings'?'active':''}" data-action="group-tab" data-tab="settings">群设置</button></div>${userPanel()}</aside>`;
 if(state.view==='groups')return `<aside class="context"><h2>我的群组</h2><div class="context-list">${state.groups.map(g=>`<button class="list-item" data-action="group-open"><strong>${g.name}</strong><small>${g.desc}</small></button>`).join('')}<button class="list-item" data-action="create-group"><strong>＋ 创建群组</strong><small>仅私密邀请入群</small></button></div>${userPanel()}</aside>`;
 return `<aside class="context"><h2>织界</h2><div class="context-list"><button class="list-item ${state.view==='friends'?'active':''}" data-action="nav" data-view="friends"><strong>好友</strong><small>申请、在线状态与账号搜索</small></button><button class="list-item" data-action="group-open"><strong>周末远征队</strong><small>8 人 · 2 个房间</small></button></div>${userPanel()}</aside>`}
function memberPanel(){if(['group','room'].includes(state.view)){if(state.view==='group'&&['rooms','members','audit','settings'].includes(state.groupTab))return '';return `<aside class="member-rail"><h3>在线 — 4</h3>${[['阿岚','群主 · 正在说话',true],['林墨','管理员 · '+(state.muted?'已静音':'在线'),false],['青禾','周末攻城中',false],['北屿','游戏中',false]].map(([n,s,speaking])=>`<div class="member-item ${speaking?'speaking':''}"><span class="avatar">${n[0]}</span><div><strong>${n}</strong><small class="${speaking?'speaking-text':''}">${s}</small></div></div>`).join('')}<h3>离线 — 4</h3><div class="member-item"><span class="avatar">洛</span><div><strong>洛川</strong><small>离线</small></div></div><p class="hint" style="padding:0 12px">此处只展示社交成员；虚拟 IP 统一在房间活动的「虚拟网络」页查看。</p></aside>`;}return ''}
function head(title,desc,actions=''){return `<header class="page-head"><div><h1>${title}</h1><p>${desc}</p></div><div class="actions">${actions}</div></header>`}
function friendRow(f){const menuOpen=state.friendMenu===f.name;return `<div class="friend-row"><button class="friend-main" data-action="friend-profile" data-name="${esc(f.name)}" aria-label="查看 ${esc(f.name)} 的资料"><span class="avatar">${esc(f.name[0])}</span><span><strong>${esc(f.name)}</strong><small><span class="friend-presence ${f.online?'online':''}" style="display:inline-block;margin-right:5px"></span>${esc(f.activity||(f.online?'在线':'离线'))}</small></span></button><div class="friend-row-actions"><button class="friend-action" data-action="friend-invite" data-name="${esc(f.name)}">邀请入群</button><button class="friend-action" data-action="friend-menu" data-name="${esc(f.name)}" aria-label="${esc(f.name)} 的更多操作" aria-expanded="${menuOpen}">⋯</button></div>${menuOpen?`<div class="friend-menu" role="menu" aria-label="好友操作"><button role="menuitem" data-action="friend-profile" data-name="${esc(f.name)}">查看资料</button><button role="menuitem" data-action="friend-copy-id" data-name="${esc(f.name)}">复制账号 ID</button><button class="friend-menu-danger" role="menuitem" data-action="delete-friend" data-name="${esc(f.name)}">删除好友</button></div>`:''}</div>`}
function friendRequests(){return `<section class="card"><h2>收到的申请 · ${state.requests.length}</h2>${state.requests.map(r=>`<div class="friend-row"><div class="friend-main"><span class="avatar">${esc(r.name[0])}</span><span><strong>${esc(r.name)}</strong><small>希望添加你为好友</small></span></div><div class="friend-request-actions"><button class="friend-action" data-action="friend-accept" data-name="${esc(r.name)}">接受</button><button class="friend-action" data-action="friend-reject" data-name="${esc(r.name)}">拒绝</button></div></div>`).join('')||'<div class="friend-empty">暂无待处理申请</div>'}<h2 style="margin-top:24px">发出的申请</h2><div class="friend-row"><div class="friend-main"><span class="avatar">洛</span><span><strong>洛川</strong><small>已发送 · 等待对方处理</small></span></div><span class="friend-count">待处理</span></div></section>`}
function friends(){const tabs=[['online','在线',state.friends.filter(f=>f.online).length],['all','全部',state.friends.length],['pending','待处理',state.requests.length]];let body='';if(state.friendTab==='pending')body=friendRequests();else{const query=state.friendQuery.trim().toLowerCase();const list=state.friends.filter(f=>(state.friendTab==='all'||f.online)&&(!query||f.name.toLowerCase().includes(query)||f.id.toLowerCase().includes(query)));body=`<section class="card"><div class="friend-toolbar"><input class="friend-search" data-input="friend-search" value="${esc(state.friendQuery)}" placeholder="搜索好友昵称或账号 ID" aria-label="搜索好友"><span class="friend-count">${list.length} 位好友</span></div>${list.length?list.map(friendRow).join(''):'<div class="friend-empty">没有匹配的好友。可调整搜索词，或点击右上角添加好友。</div>'}</section>`}return head('好友','查看状态、管理关系，或邀请朋友加入群组',`<button class="btn primary" data-action="add-friend">添加好友</button>`)+`<div class="friend-tabs" role="tablist" aria-label="好友分类">${tabs.map(([id,label,count])=>`<button class="friend-tab ${state.friendTab===id?'active':''}" role="tab" aria-selected="${state.friendTab===id}" data-action="friend-tab" data-tab="${id}">${label} ${count}</button>`).join('')}</div>${body}<p class="hint">好友关系不授予群组或房间权限；首版不提供好友私聊。</p>`}
function groups(){return head('群组','长期保存的私密协作空间',`<button class="btn primary" data-action="create-group">创建群组</button>`)+`<div class="notice">这里没有公开群搜索。只有有效私密邀请或邀请码可以入群。</div><div class="grid">${state.groups.map(g=>`<section class="card"><h2>${g.name}</h2><p class="muted">${g.desc}</p><button class="btn" data-action="group-open">进入群组</button></section>`).join('')}</div>`}
function group(){const titles={messages:['# 大厅闲聊','和朋友聊聊，也可以随时加入下方游戏房间'],rooms:['房间管理','持久房间与临时活动分开管理'],members:['成员与角色','当前群成员和执行时权限'],invites:['# 邀请与组队','邀请朋友加入这个私密群组'],audit:['管理记录','仅当前群主和管理员只读查看'],settings:['群设置','资料、转让、退出与解散']};const title=titles[state.groupTab]||titles.messages;return head(title[0],title[1],`<select aria-label="模拟当前身份" data-change="role"><option value="owner" ${state.role==='owner'?'selected':''}>原型身份：群主</option><option value="admin" ${state.role==='admin'?'selected':''}>原型身份：管理员</option><option value="member" ${state.role==='member'?'selected':''}>原型身份：成员</option><option value="host" ${state.role==='host'?'selected':''}>原型身份：房主</option></select>`)+groupTab()}
function messageView(m){
 if(m.deleted)return `<div class="message"><span class="avatar">${esc(m.user[0])}</span><div class="message-body"><div><strong>${esc(m.user)}</strong> <span class="message-meta">${m.time}</span></div><div class="message-deleted">${esc(m.text)}</div></div></div>`;
 const own=m.user==='林墨',canDelete=own||['owner','admin'].includes(state.role),menuOpen=state.messageMenu===m.id;
 return `<div class="message" data-message="${m.id}" tabindex="0" aria-label="${esc(m.user)} 的消息，按 Tab 查看操作"><span class="avatar">${esc(m.user[0])}</span><div class="message-body"><div><strong>${esc(m.user)}</strong> <span class="message-meta">${m.time}</span></div><div>${esc(m.text)}</div></div><div class="message-actions ${menuOpen?'menu-open':''}"><button class="message-action" data-action="copy-message" data-id="${m.id}" aria-label="复制消息" title="复制消息">⧉</button>${canDelete?`<button class="message-action" data-action="message-menu" data-id="${m.id}" aria-label="更多消息操作" aria-expanded="${menuOpen}" aria-controls="message-menu-${m.id}" title="更多操作">⋯</button>`:''}${menuOpen&&canDelete?`<div class="message-menu" id="message-menu-${m.id}" role="menu" aria-label="消息操作"><button class="message-menu-danger" role="menuitem" data-action="delete-message" data-id="${m.id}">${own?'删除消息':'删除消息（管理员）'}</button></div>`:''}</div></div>`
}
function groupTab(){const tab=state.groupTab;
 if(tab==='messages')return `<section class="card"><h2>群消息</h2><p class="muted small">悬停或按 Tab 聚焦消息可查看操作；删除需确认，管理员代删会追加管理记录。</p><div>${state.messages.map(messageView).join('')}</div><form class="composer" data-form="message"><input id="message-input" aria-label="消息内容" placeholder="给 #大厅闲聊 发消息（仅保存在当前页面）"><button class="btn primary" type="submit">发送</button></form></section>`;
 if(tab==='rooms')return `<div class="page-head"><div><h2>持久房间</h2><p>活动结束不会删除房间配置</p></div><button class="btn primary" data-action="create-room">创建房间</button></div>${state.rooms.map(r=>`<section class="card"><div class="row"><div class="row-main"><div class="row-title">${r.name} ${statusBadge(r.open?'开放':'暂停')}</div><p class="muted">${r.game} · ${r.state} · 房主 ${r.owner}</p><small>${r.count}/16 个账号（断线保留也占名额）</small></div><button class="btn primary" data-action="room-open" data-room="${r.name}">${state.joined&&state.currentRoom===r.name?'返回活动':'查看房间'}</button></div></section>`).join('')}`;
 if(tab==='members')return `<section class="card"><h2>成员 · 8</h2>${[['阿岚','群主','在线'],['林墨','管理员','在线'],['北屿','普通成员','离线'],['青禾','普通成员','在线']].map(([n,r,o])=>`<div class="row"><div class="person"><span class="avatar">${n[0]}</span><div><div class="row-title">${n}</div><small class="muted">${r} · ${o}</small></div></div><div class="actions"><button class="btn small" data-action="assign-role" data-name="${n}">调整角色</button><button class="btn small danger" data-action="remove-member" data-name="${n}">移出</button></div></div>`).join('')}<div class="notice small">移出会撤销后续群同步、语音、虚拟网络、恢复和设备活动资格；被移出不等于封禁，可凭新邀请以普通成员重入。</div></section>`;
 if(tab==='invites')return `<div class="page-head"><div><h2>私密邀请</h2><p>默认不过期；撤销或邀请人失去群籍会使待接受邀请失效</p></div><button class="btn primary" data-action="invite">邀请用户</button></div><section class="card">${state.invites.map(i=>`<div class="row"><div><strong>${i.name}</strong><br><small class="muted">由 ${i.by} 邀请 · ${i.status}</small></div><button class="btn small" data-action="revoke-invite" data-name="${i.name}">撤销</button></div>`).join('')||'<p class="muted">暂无待接受邀请</p>'}<div class="notice small">普通成员可邀请，但只有群主和管理员可撤销。重复接受不会重复建员；已接受成员不随邀请人退群。</div></section>`;
 if(tab==='audit'){if(!['owner','admin'].includes(state.role))return `<div class="notice danger"><strong>无权限查看管理记录</strong><br>仅当前群主和管理员可按群只读查看；旧管理员或跨群管理员同样会被拒绝。</div>`;return `<section class="card"><h2>只读管理记录</h2><p class="muted small">只追加，产品内没有修改、删除或清空入口；不记录密码、验证码或令牌。</p><div class="table-wrap"><table><thead><tr><th>操作者</th><th>操作</th><th>目标</th><th>时间</th><th>结果</th></tr></thead><tbody>${state.audit.map(a=>`<tr><td>${a.actor}</td><td>${a.action}</td><td>${a.target}</td><td>${a.time}</td><td>${a.result}</td></tr>`).join('')}</tbody></table></div></section>`}
 return `<div class="grid"><section class="card"><h2>群资料</h2><div class="field"><label>群名称</label><input value="周末远征队" ${state.role!=='owner'?'disabled':''}></div><div class="field"><label>简介</label><textarea ${!['owner','admin'].includes(state.role)?'disabled':''}>固定游戏小队，周末一起远征。</textarea></div><button class="btn" data-action="save-group">保存群资料</button></section><section class="card"><h2>群主治理</h2><p class="muted">转让完成前原群主不变；群主退出前必须转让或解散。</p><div class="actions"><button class="btn" data-action="transfer-owner">转让群主</button><button class="btn" data-action="owner-recovery">人工恢复申请</button><button class="btn" data-action="leave-group">退出群组</button><button class="btn danger" data-action="dissolve-group">解散群组</button></div></section></div>`}
function room(){const r=state.rooms.find(x=>x.name===state.currentRoom)||state.rooms[0];if(!state.joined)return head(r.name,`${r.game} · 持久房间 · 房主 ${r.owner}`,`<button class="btn" data-action="room-settings">房间设置</button>`)+`<div class="grid"><section class="card"><h2>房间状态</h2><p>${statusBadge(r.open?'开放':'暂停')} ${badge(r.state)}</p><div class="row"><span>活动成员</span><strong>${r.count}/16</strong></div><div class="row"><span>加入条件</span><span>当前群籍 + 密码/管理员豁免</span></div><div class="row"><span>活动规则</span><span>同账号全局单活动、单设备</span></div><button class="btn primary" data-action="join-room">加入房间活动</button></section><section class="card"><h2>加入后会发生什么</h2><ol><li>创建活动资格与设备租约</li><li>并行自动连接语音和虚拟网络</li><li>获取本人及成员虚拟 IP</li><li>在游戏中手动输入 IP 联机</li></ol><p class="hint">结束活动保留此房间；删除房间才终止所有会话和恢复。</p></section></div>`;
 const tab=state.roomTab,tabs=[['overview','活动概览'],['voice','语音'],['network','虚拟网络']];
 const voiceCard=`<section class="card"><h2>语音 ${statusBadge(statusText(state.voice))}</h2><p class="muted">最多 16 人双向语音 · 多人同时发言</p><div class="status-line"><i class="dot ${state.voice==='connected'?'ok':'bad'}"></i>${state.voice==='failed'?'媒体服务不可达，可独立重试':'真实状态将来自媒体连接事件'}</div><div class="actions"><button class="btn small primary" data-action="voice-retry">独立重试</button><button class="btn small" data-action="voice-fail">模拟语音失败</button>${tab==='overview'?'<button class="btn small" data-action="room-tab" data-tab="voice">打开语音控制</button>':''}</div></section>`;
 const networkCard=`<section class="card"><h2>虚拟网络 ${statusBadge(statusText(state.network))}</h2><p class="muted">仅同房有效活动成员 · /27 活动网段</p><div class="status-line"><i class="dot ${state.network==='connected'?'ok':'bad'}"></i>${state.network==='failed'?'虚拟网络连接失败，可独立重试':'真实状态将来自网络连接事件'}</div><div class="actions"><button class="btn small primary" data-action="network-retry">独立重试</button><button class="btn small" data-action="network-fail">模拟网络失败</button>${tab==='overview'?'<button class="btn small" data-action="room-tab" data-tab="network">查看虚拟 IP</button>':''}</div><p class="hint">不修改默认路由，不代理互联网，不转发物理 LAN。</p></section>`;

 if(tab==='network')body=`${networkCard}<section class="card"><h2>我的虚拟 IP</h2><div class="row"><span class="ip">${state.currentIp}</span><button class="btn small primary" data-action="copy-ip" data-ip="${state.currentIp}">复制</button></div></section><section class="card"><h2>活动成员与手动联机</h2><p class="muted small">复制成员虚拟 IP，在游戏内手动输入；不依赖广播发现</p><div class="member-ip-list">${[['林墨（我）',state.currentIp],['阿岚','10.66.0.10'],['北屿','10.66.0.11'],['青禾','10.66.0.13']].map(([n,ip])=>`<div class="row"><div class="person"><span class="avatar">${n[0]}</span><div><div class="row-title">${n}</div><small class="muted">同房活动成员</small></div></div><span class="ip">${ip}</span><button class="btn small" data-action="copy-ip" data-ip="${ip}">复制 IP</button></div>`).join('')}</div><p class="hint">步骤：1. 复制自己或成员的虚拟 IP；2. 在游戏中选择“直接连接 / 输入 IP”；3. 粘贴并连接。工具不自动发现游戏。</p></section>`;

function statusText(s){return({connected:'已连接',failed:'失败',retrying:'重试中',connecting:'连接中',disconnected:'已断开'}[s]||s)}

function render(){const app=document.getElementById('app');if(!state.authenticated){app.innerHTML=authView();renderModal();return}let content='';if(state.view==='friends')content=friends();if(state.view==='groups')content=groups();if(state.view==='group')content=group();if(state.view==='room')content=room();if(state.view==='account')content=account();app.innerHTML=`<div class="shell">${nav()}${context()}<main class="main">${content}<div class="footer-note">B1 C 端社交结构与流程原型 · 深色仅作方向示意 · 模拟数据 · 真实能力未验证</div></main>${memberPanel()}</div>`;renderModal()}
function roleName(){return({owner:'群主',admin:'群管理员',member:'普通成员',host:'普通成员兼房主'}[state.role])}

 else if(a==='send-friend'){const account=document.getElementById('friend-account-input')?.value.trim();closeModal();toast(account?`已向 ${account} 发送模拟好友申请。`:'请输入邮箱或账号 ID。')}

 else if(a==='friend-profile'){const f=state.friends.find(x=>x.name===b.dataset.name);if(!f)return;state.friendMenu=null;openModal(f.name,`<div class="friend-profile"><span class="avatar">${esc(f.name[0])}</span><div><strong>${esc(f.name)}</strong><p class="muted small">${esc(f.id)} · ${esc(f.activity||(f.online?'在线':'离线'))}</p></div></div><div class="notice small">共同群组：周末远征队<br>成为好友不会自动获得群组或房间权限。</div><div class="actions"><button class="btn primary" data-action="friend-invite" data-name="${esc(f.name)}">邀请入群</button><button class="btn" data-action="friend-copy-id" data-name="${esc(f.name)}">复制账号 ID</button><button class="btn danger" data-action="delete-friend" data-name="${esc(f.name)}">删除好友</button></div>`) }

 else if(a==='confirm-leave'){state.joined=false;state.grace=false;state.voice='disconnected';state.network='disconnected';closeModal();render();toast('已退出活动；持久房间仍保留。')}

 else if(a==='transfer-fail'){closeModal();toast('目标设备不可用；旧活动保持不变，无双活动。')}
 else if(a==='confirm-device-transfer'){closeModal();toast('活动资格已原子转移；旧设备连接失效（模拟）。')}
 else if(a==='room-settings'){openModal('房间管理','<div class="field"><label>房间名称</label><input value="周末攻城"></div><div class="field"><label>游戏名</label><input value="示例游戏 A"></div><div class="field"><label>新房主（当前有效成员）</label><select><option>阿岚</option><option>林墨</option><option>青禾</option></select></div><div class="field"><label>修改密码（只影响新加入）</label><input type="password"></div><p class="hint">房主退群、被移除或账号失效时由群主接管；普通离线、退房和凭据过期不触发接管。</p><div class="actions"><button class="btn" data-action="pause-room">暂停/重新开放</button><button class="btn danger" data-action="end-activity">结束活动</button><button class="btn danger" data-action="delete-room">删除房间</button></div>')}
 else if(a==='pause-room'){closeModal();toast('开放状态已切换；暂停不清退现有成员，重新开放须在房外执行（模拟）。')}
 else if(a==='end-activity'){openModal('结束活动','<p>将清退所有成员并终止语音、虚拟网络和恢复，但保留房间配置及暂停状态。</p>','confirm-end','结束活动',true)}
 else if(a==='confirm-end'){state.joined=false;state.grace=false;state.voice='disconnected';state.network='disconnected';closeModal();render();toast('活动已结束，房间配置保留（模拟）。')}
 else if(a==='delete-room'){openModal('永久删除房间','<p>删除为终态：终止全部会话和恢复，房间不再可用。此操作不同于结束活动。</p>','confirm-delete-room','删除房间',true)}
 else if(a==='confirm-delete-room'){state.joined=false;closeModal();state.view='group';state.groupTab='rooms';render();toast('原型返回房间列表；未实际删除模拟数据。')}
 else if(a==='copy-message'){const m=state.messages.find(x=>x.id===Number(b.dataset.id));if(!m)return;try{await navigator.clipboard.writeText(m.text);toast('消息内容已复制。')}catch{toast('复制不可用，请手动选择消息文本。')} }
 else if(a==='message-menu'){const id=Number(b.dataset.id);state.messageMenu=state.messageMenu===id?null:id;render();document.querySelector(`[data-action="message-menu"][data-id="${id}"]`)?.focus()}
 else if(a==='delete-message'){const id=Number(b.dataset.id),m=state.messages.find(x=>x.id===id);if(!m)return;const own=m.user==='林墨';if(!own&&!requireAdmin())return;state.messageMenu=null;openModal(own?'删除你的消息':'以管理员身份删除消息',`<p>将删除 ${esc(m.user)} 的这条消息：</p><div class="notice small">“${esc(m.text)}”</div><p class="hint">删除后原位置保留提示，不恢复原文。${own?'':'本次代删会追加只读管理记录。'}</p>`,'confirm-delete-message',own?'删除消息':'确认代删',true);state.modal.target=id;renderModal()}
 else if(a==='confirm-delete-message'){const id=Number(state.modal.target),m=state.messages.find(x=>x.id===id);if(!m){closeModal();return}const own=m.user==='林墨';if(!own&&!requireAdmin())return;m.deleted=true;m.text=own?'一条消息已被作者删除':'一条消息已被管理员删除';if(!own)state.audit.unshift({actor:'林墨',action:'代删消息',target:`消息 M-${id}`,time:'2026-10-26 20:00',result:'成功'});closeModal();render();toast(own?'消息已删除，原位置保留提示。':'消息已代删，管理记录已追加。')}
 else if(a==='assign-role'){if(!requireAdmin())return;openModal('调整成员角色',`<p>目标：${b.dataset.name}</p><div class="field"><label>新角色</label><select><option>普通成员</option><option>群管理员</option></select></div><p class="hint">管理员不能管理群主或同级；角色撤销后旧页面和旧会话操作失败。</p>`,'confirm-role','保存角色')}
 else if(a==='confirm-role'){closeModal();toast('角色变更已记录（模拟）。')}
 else if(a==='remove-member'){if(!requireAdmin())return;openModal('移出成员',`<p>移出 ${b.dataset.name} 将撤销群同步、语音、网络、恢复及设备活动资格。被踢出房间不等于封禁，可在没有其他失权时按当前规则重入。</p>`,'confirm-remove','确认移出',true)}
 else if(a==='confirm-remove'){closeModal();toast('成员已移出并触发全部分域撤销（模拟）。')}
 else if(a==='save-group'){if(!requireAdmin())return;toast('群资料已保存（模拟）。')}
 else if(a==='transfer-owner'){if(state.role!=='owner'){toast('仅当前群主可发起转让。');return}openModal('转让群主','<div class="field"><label>指定当前有效成员</label><select><option>林墨</option><option>青禾</option></select></div><p>对方接受前，原群主及权限保持不变。</p><button class="btn" data-action="transfer-accept">模拟指定成员接受</button>','confirm-transfer','发送转让请求')}
 else if(a==='confirm-transfer'){closeModal();toast('转让请求已发送，等待指定成员接受。')}
 else if(a==='transfer-accept'){closeModal();toast('指定成员已接受，群主转让完成（模拟）。')}
 else if(a==='owner-recovery'){openModal('群主不可用人工恢复申请','<div class="field"><label>情况说明</label><textarea placeholder="说明群主不可用原因"></textarea></div><div class="field"><label>证据引用</label><input placeholder="不上传秘密；填写证据引用"></div><p class="hint">仅人工有证据处理；证据不足或存在争议时保持原归属，不自动继任。</p>','confirm-recovery','提交申请')}
 else if(a==='confirm-recovery'){closeModal();toast('恢复申请已记录，等待人工处理（模拟）。')}
 else if(a==='leave-group'){if(state.role==='owner'){openModal('群主暂不能退出','<p>必须先完成群主转让，或选择解散群组。仅发送转让请求但对方未接受时，仍不能退出。</p>')}else openModal('退出群组','<p>退出会撤销群内容同步和本群全部活动资格。你发出的待接受邀请将失效，已经接受的成员不受影响。</p>','confirm-leave-group','退出群组',true)}
 else if(a==='confirm-leave-group'){closeModal();state.view='groups';render();toast('已退出群组（模拟）。')}
 else if(a==='dissolve-group'){if(state.role!=='owner'){toast('仅群主可解散群组。');return}openModal('解散群组','<p>解散后，群、消息、房间、邀请和管理记录在产品内不可查看或恢复，全部活动与连接终止。此表述不等于未经验证的立即物理删除。</p>','confirm-dissolve','确认解散',true)}
 else if(a==='confirm-dissolve'){state.joined=false;closeModal();state.view='groups';render();toast('群组已解散（仅演示路径，未删除模拟数据）。')}
 else if(a==='support-matrix'){openModal('安装与支持矩阵',`<div class="notice warn"><strong>当前所有平台与游戏均为“候选 / 未验证”</strong><br>不得由此原型推断安装、语音、TUN、跨平台互通或游戏兼容性已通过。</div><div class="table-wrap"><table><thead><tr><th>平台</th><th>候选安装/更新</th><th>权限条件</th><th>结论</th></tr></thead><tbody><tr><td>Windows 10 22H2 / 11 x64</td><td>NSIS</td><td>Helper 安装需管理员授权</td><td>${badge('未验证','error')}</td></tr><tr><td>macOS 13+ Intel / Apple Silicon</td><td>DMG / ZIP</td><td>签名、公证待验证</td><td>${badge('未验证','error')}</td></tr><tr><td>Ubuntu 22.04 / 24.04 x86_64</td><td>AppImage</td><td>systemd 与桌面环境待验证</td><td>${badge('未验证','error')}</td></tr></tbody></table></div><p class="hint">后续须逐平台验证安装、更新、卸载与数据保持；卸载不等于删除服务端数据。工具互通不等于游戏自身跨平台能力，未测游戏不标为兼容。</p>`)}
 else if(a==='auth-security'){openModal('账号安全','<p>真实实现须使用安全凭据存储、传输保护、验证码限次限流和令牌轮换。原型不保存输入，不验证这些安全机制。</p>')}
 else if(a==='modal-close'){closeModal()}
});
document.addEventListener('change',e=>{if(e.target.dataset.change==='role'){state.role=e.target.value;state.messageMenu=null;if(state.groupTab==='audit'&&!['owner','admin'].includes(state.role))state.groupTab='audit';render();toast(`已切换为${roleName()}，仅用于权限走查。`)} });
document.addEventListener('input',e=>{if(e.target.dataset.input==='volume'){state.volume=e.target.value;e.target.nextElementSibling.textContent=state.volume+'%'}if(e.target.dataset.input==='member-volume'){state.memberVolume=e.target.value;e.target.nextElementSibling.textContent=state.memberVolume+'%'}if(e.target.dataset.input==='friend-search'){state.friendQuery=e.target.value;render();const input=document.querySelector('[data-input="friend-search"]');input.focus();input.setSelectionRange(input.value.length,input.value.length)} });
document.addEventListener('submit',e=>{if(e.target.dataset.form==='message'){e.preventDefault();const input=document.getElementById('message-input');if(input.value.trim()){state.messages.push({id:Date.now(),user:'林墨',time:'20:01',text:input.value.trim()});render()} } });
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if(state.modal)closeModal();else if(state.messageMenu!=null||state.friendMenu!=null){state.messageMenu=null;state.friendMenu=null;render()} });
render();
</script>
