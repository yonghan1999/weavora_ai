mybatis:
  mapper-locations: classpath:/mappers/*.xml
  configuration:
    map-underscore-to-camel-case: true
spring:
  application:
    name: zhijie-control-plane
  datasource:
    url: ${ZHIJIE_DATABASE_URL:jdbc:postgresql://localhost:5432/zhijie}
    username: ${ZHIJIE_DATABASE_USERNAME:zhijie}
    password: ${ZHIJIE_DATABASE_PASSWORD:}
  flyway:
    enabled: true
  mail:
    host: ${ZHIJIE_SMTP_HOST:}
    port: ${ZHIJIE_SMTP_PORT:587}
    username: ${ZHIJIE_SMTP_USERNAME:}
    password: ${ZHIJIE_SMTP_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: ${ZHIJIE_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${ZHIJIE_SMTP_STARTTLS:true}
      mail.smtp.starttls.required: ${ZHIJIE_SMTP_STARTTLS:true}
      mail.smtp.ssl.enable: ${ZHIJIE_SMTP_SSL:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
      mail.debug: false
management:
  health:
    mail:
      enabled: ${zhijie.mail.enabled}
zhijie:
  mail:
    enabled: ${ZHIJIE_MAIL_ENABLED:false}
    from: ${ZHIJIE_MAIL_FROM:}
