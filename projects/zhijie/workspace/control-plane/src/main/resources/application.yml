mybatis:
  mapper-locations: classpath:/mappers/*.xml
  configuration:
    map-underscore-to-camel-case: true
spring:
  application:
    name: zhijie-control-plane
  datasource:
    url: ${ZHIJIE_DATABASE_URL:jdbc:postgresql://localhost:5432/zhijie}
    username: ${ZHIJIE_DATABASE_USERNAME:zhijie}
    password: ${ZHIJIE_DATABASE_PASSWORD:}
  flyway:
    enabled: true
